version: '3.8'

services:
  mysql:
    image: mysql:8.1
    container_name: uxia-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: miPasswordSegura
      MYSQL_DATABASE: uxia_db
      MYSQL_USER: uxia_user
      MYSQL_PASSWORD: uxia_pass
    ports:
      - "3307:3306"
    volumes:
      - uxia-mysql-data:/var/lib/mysql

volumes:
  uxia-mysql-data:
